name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches the server
        run: pnpm gen:api && git diff --exit-code packages/api-client
      - run: pnpm lint:web
      - run: pnpm build:web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build .

  # Each push to main that passes the checks increments the version, publishes the image
  # for amd64 and arm64 (Raspberry Pi), and creates a GitHub release, so servers update
  # with `docker compose pull` and show the new version in the footer.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [server, web, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        name: Determine version and update package metadata
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          pyproject_path = Path("server/pyproject.toml")
          data = tomllib.loads(pyproject_path.read_text())
          p_ver = tuple(int(x) for x in data["project"]["version"].split("."))

          if ref.startswith("refs/tags/v"):
              ver_str = ref.removeprefix("refs/tags/v")
              ver = tuple(int(x) for x in ver_str.split("."))
              create_release = False
          else:
              tags = subprocess.check_output(["git", "tag", "-l", "v*.*.*"], text=True).splitlines()
              semver_tags = []
              for t in tags:
                  m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", t.strip())
                  if m:
                      semver_tags.append(tuple(int(x) for x in m.groups()))
              latest_tag = max(semver_tags, default=(0, 0, 0))
              ver = p_ver if p_ver > latest_tag else (latest_tag[0], latest_tag[1], latest_tag[2] + 1)
              ver_str = f"{ver[0]}.{ver[1]}.{ver[2]}"
              create_release = True

          old_ver = data["project"]["version"]
          if old_ver != ver_str:
              pyproject_path.write_text(
                  pyproject_path.read_text().replace(f'version = "{old_ver}"', f'version = "{ver_str}"', 1)
              )
              lock_path = Path("server/uv.lock")
              lock_path.write_text(
                  re.sub(
                      r'(name = "iwanttowatch"\r?\nversion = )"[^"]+"',
                      rf'\g<1>"{ver_str}"',
                      lock_path.read_text(),
                      count=1,
                  )
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={ver_str}\n")
              out.write(f"major_minor={ver[0]}.{ver[1]}\n")
              out.write(f"create_release={'true' if create_release else 'false'}\n")
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create git tag and GitHub release
        if: steps.version.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            gh release create "v${{ steps.version.outputs.version }}" \
              --target "${{ github.sha }}" \
              --title "iWantToWatch v${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
