name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: |
          cd mobile
          pnpm dlx expo prebuild --platform android --clean

      - name: Build Release APK
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for clarity
        run: |
          cd mobile/android/app/build/outputs/apk/release
          cp app-release.apk iWantToWatch.apk 2>/dev/null || cp *-release*.apk iWantToWatch.apk 2>/dev/null || true

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWantToWatch-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" mobile/android/app/build/outputs/apk/release/iWantToWatch.apk --clobber
