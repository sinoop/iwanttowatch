<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <clipPath id="topStickClip">
      <rect x="9" y="14" width="46" height="8.5" rx="3"/>
    </clipPath>
    <clipPath id="midStickClip">
      <rect x="9" y="24.5" width="46" height="8" rx="2.5"/>
    </clipPath>
  </defs>

  <!-- Lower Slate with FULL GOLDEN BORDER (3px) -->
  <rect x="9" y="33" width="46" height="24" rx="4" fill="url(#slateGrad)" stroke="url(#goldRim)" stroke-width="3"/>

  <!-- Production Lines in Gold -->
  <line x1="14" y1="38" x2="25" y2="38" stroke="#f5a524" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="14" y1="43" x2="23" y2="43" stroke="#f5a524" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="14" y1="48" x2="26" y2="48" stroke="#f5a524" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Glowing Play Button -->
  <circle cx="39" cy="45" r="9" fill="#0b1120" stroke="url(#goldRim)" stroke-width="2"/>
  <path d="M 37 41 L 43.5 45 L 37 49 Z" fill="url(#goldRim)"/>

  <!-- Star -->
  <path d="M 48 37.5 L 48.8 39.2 L 50.7 39.4 L 49.3 40.7 L 49.7 42.5 L 48 41.5 L 46.3 42.5 L 46.7 40.7 L 45.3 39.4 L 47.2 39.2 Z" fill="#fde047"/>

  <!-- Mid Stick with Full Gold Border -->
  <g clip-path="url(#midStickClip)">
    <rect x="9" y="24.5" width="46" height="8" fill="#0b1120"/>
    <polygon points="9,24.5 15,24.5 7,33 1,33" fill="#f5a524"/>
    <polygon points="20,24.5 26,24.5 18,33 12,33" fill="#f5a524"/>
    <polygon points="31,24.5 37,24.5 29,33 23,33" fill="#f5a524"/>
    <polygon points="42,24.5 48,24.5 40,33 34,33" fill="#f5a524"/>
    <polygon points="53,24.5 55,24.5 51,33 45,33" fill="#f5a524"/>
  </g>
  <rect x="9" y="24.5" width="46" height="8" rx="2.5" fill="none" stroke="url(#goldRim)" stroke-width="2.6"/>

  <!-- Top Angled Stick with Full Gold Border -->
  <g transform="rotate(-15 10 24.5)">
    <g clip-path="url(#topStickClip)">
      <rect x="9" y="14" width="46" height="8.5" fill="#0b1120"/>
      <polygon points="12,14 18,14 10,23 4,23" fill="#f5a524"/>
      <polygon points="23,14 29,14 21,23 15,23" fill="#f5a524"/>
      <polygon points="34,14 40,14 32,23 26,23" fill="#f5a524"/>
      <polygon points="45,14 51,14 43,23 37,23" fill="#f5a524"/>
    </g>
    <rect x="9" y="14" width="46" height="8.5" rx="3" fill="none" stroke="url(#goldRim)" stroke-width="2.8"/>
  </g>

  <!-- Hinge Pin -->
  <circle cx="11.5" cy="24.5" r="2.8" fill="#fde047" stroke="#0b1120" stroke-width="1"/>
</svg>
