<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="64" height="64" rx="14" fill="#0b1120"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#f5a524" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Outer Stylized Eye Contour -->
  <path d="M 7 32 C 16 17, 48 17, 57 32 C 48 47, 16 47, 7 32 Z" fill="#131d31" stroke="url(#amberGlow)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cinema Film Reel Outer Ring -->
  <circle cx="32" cy="32" r="13" fill="#0f172a" stroke="url(#amberGlow)" stroke-width="2"/>

  <!-- Spool Cutout Holes -->
  <circle cx="32.00" cy="23.80" r="2.2" fill="#0b1120" stroke="#f5a524" stroke-width="1.2"/>
  <circle cx="39.80" cy="29.47" r="2.2" fill="#0b1120" stroke="#f5a524" stroke-width="1.2"/>
  <circle cx="36.82" cy="38.63" r="2.2" fill="#0b1120" stroke="#f5a524" stroke-width="1.2"/>
  <circle cx="27.18" cy="38.63" r="2.2" fill="#0b1120" stroke="#f5a524" stroke-width="1.2"/>
  <circle cx="24.20" cy="29.47" r="2.2" fill="#0b1120" stroke="#f5a524" stroke-width="1.2"/>

  <!-- Glowing Iris / Hub -->
  <circle cx="32" cy="32" r="4.6" fill="url(#pupilGlow)"/>

  <!-- Center Play Button in Iris -->
  <path d="M 30.5 29.5 L 34.8 32 L 30.5 34.5 Z" fill="#0b1120"/>
</svg>
